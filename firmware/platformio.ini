; PlatformIO Project Configuration File for ESP32-S3 KWS
; Target: ESP32-S3 (Xtensa Dual-Core 240MHz, Vector Instructions)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Cấu hình cổng nạp và cổng giao tiếp Serial
upload_port = COM10
upload_speed = 921600

monitor_port = COM10
monitor_speed = 115200

; Tần số hoạt động của CPU và bộ nhớ Flash
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Cấu hình cờ biên dịch: Kích hoạt USB CDC Native cho Serial Monitor trên COM10
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -O3
    -DESP32_S3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
